<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Institutional Trading - Site en construction</title>
  <style>
    :root {
      --bg: #04070d;
      --paper: #f7f2e8;
      --muted: rgba(247,242,232,.68);
      --line: rgba(247,242,232,.14);
      --gold: #d9a844;
      --orange: #ff8a21;
      --cyan: #20c7ff;
      --green: #00d08a;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background:
        linear-gradient(rgba(247,242,232,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(247,242,232,.024) 1px, transparent 1px),
        radial-gradient(circle at 18% 16%, rgba(255,138,33,.18), transparent 28rem),
        radial-gradient(circle at 82% 20%, rgba(32,199,255,.18), transparent 30rem),
        radial-gradient(circle at 62% 86%, rgba(0,208,138,.12), transparent 30rem),
        var(--bg);
      background-size: 58px 58px, 58px 58px, auto, auto, auto, auto;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      background:
        conic-gradient(from 120deg at 50% 50%, transparent 0 64%, rgba(32,199,255,.16), transparent 74%),
        linear-gradient(120deg, transparent 0 43%, rgba(255,255,255,.08) 44%, transparent 46%);
      animation: drift 14s linear infinite;
      opacity: .72;
    }

    main {
      position: relative;
      width: min(1060px, calc(100% - 34px));
      padding: clamp(28px, 6vw, 74px);
      border: 1px solid var(--line);
      border-radius: clamp(28px, 5vw, 52px);
      background:
        radial-gradient(circle at 22% 0, rgba(217,168,68,.18), transparent 22rem),
        radial-gradient(circle at 86% 10%, rgba(32,199,255,.14), transparent 26rem),
        linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.025)),
        rgba(5,8,14,.82);
      box-shadow: 0 50px 160px rgba(0,0,0,.52), inset 0 1px 0 rgba(255,255,255,.10);
      overflow: hidden;
    }

    main::after {
      content: "TRADING DESK";
      position: absolute;
      right: -22px;
      bottom: -22px;
      color: rgba(247,242,232,.045);
      font-size: clamp(76px, 13vw, 190px);
      line-height: .72;
      font-weight: 1000;
      letter-spacing: -.08em;
      pointer-events: none;
    }

    .mark {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      color: #090806;
      background: linear-gradient(135deg, #fff0a5, var(--gold), var(--orange));
      font-size: 24px;
      font-weight: 1000;
      box-shadow: 0 24px 70px rgba(217,168,68,.28);
    }

    .eyebrow {
      margin-top: 34px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 880px;
      margin: 18px 0 0;
      font-size: clamp(48px, 8vw, 118px);
      line-height: .84;
      letter-spacing: -.05em;
    }

    p {
      max-width: 720px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.65;
      font-weight: 750;
    }

    .status {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 34px;
    }

    .status div {
      min-height: 104px;
      display: grid;
      align-content: center;
      gap: 8px;
      padding: 18px;
      border: 1px solid rgba(247,242,232,.12);
      border-radius: 22px;
      background: rgba(255,255,255,.045);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }

    .status span {
      color: rgba(247,242,232,.55);
      font-size: 10px;
      font-weight: 950;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .status strong {
      font-size: 20px;
      line-height: 1.05;
    }

    .bar {
      width: min(560px, 100%);
      height: 10px;
      margin-top: 34px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
    }

    .bar span {
      display: block;
      width: 64%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--orange), var(--gold), var(--cyan));
      box-shadow: 0 0 34px rgba(32,199,255,.32);
      animation: pulse 2.8s ease-in-out infinite;
    }

    @keyframes drift {
      to { transform: translate3d(5%, -4%, 0) rotate(360deg); }
    }

    @keyframes pulse {
      50% { width: 86%; filter: brightness(1.25); }
    }

    @media (max-width: 720px) {
      body { overflow: auto; padding: 18px 0; }
      .status { grid-template-columns: 1fr; }
      main { border-radius: 28px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">IT</div>
    <div class="eyebrow">Institutional Trading / maintenance active</div>
    <h1>Le desk revient plus fort.</h1>
    <p>Le site est temporairement en construction pendant une mise a jour premium. Les acces clients, le support et les activations restent traites en interne.</p>
    <div class="status">
      <div><span>Etat</span><strong>Upgrade en cours</strong></div>
      <div><span>Acces</span><strong>Reserve admin</strong></div>
      <div><span>Retour</span><strong>Bientot en ligne</strong></div>
    </div>
    <div class="bar" aria-hidden="true"><span></span></div>
  </main>
</body>
</html>
