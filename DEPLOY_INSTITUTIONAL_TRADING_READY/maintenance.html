<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Site en maintenance</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      color: #f7f2e8;
      background:
        radial-gradient(circle at 50% 20%, rgba(217,168,68,.18), transparent 28rem),
        linear-gradient(135deg, #030509, #080b10 58%, #030509);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      text-align: center;
    }

    main {
      width: min(680px, calc(100% - 32px));
      padding: 44px 28px;
      border: 1px solid rgba(247,242,232,.14);
      border-radius: 28px;
      background: rgba(8,12,18,.72);
      box-shadow: 0 36px 120px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.08);
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 8vw, 86px);
      line-height: .9;
      letter-spacing: -.04em;
    }
  </style>
</head>
<body>
  <main>
    <h1>Site en maintenance</h1>
  </main>
</body>
</html>
